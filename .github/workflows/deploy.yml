name: CI/CD Pipeline - BeanCounter

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para a Oracle Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 Iniciando o Deploy do BeanCounter..."
            
            if [ ! -d "~/BeanCounter" ]; then
              git clone https://github.com/RuanPablo2/BeanCounter.git ~/BeanCounter
            fi
            
            cd ~/BeanCounter
            echo "📥 Puxando código novo do GitHub..."
            git pull origin main

            echo "🔨 Compilando a API (via Docker Maven)..."
            sudo docker run --rm -v "$PWD":/app -w /app maven:3.9-eclipse-temurin-21 mvn clean package -Dmaven.test.skip=true

            echo "🐳 Reiniciando os containers Docker..."
            sudo docker compose -f docker-compose.prod.yml up -d --build

            echo "🧹 Limpando imagens antigas..."
            sudo docker image prune -f

            echo "✅ Deploy do BeanCounter concluído com sucesso!"